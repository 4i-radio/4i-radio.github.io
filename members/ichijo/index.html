span></span></button><button class="plant-card" type="button" aria-label="モンステラ・デリシオーサ「ミドリ」の詳細を表示"><span class="card-image"><img loading="lazy" src="/members/ichijo/plants/03a-monstera-midori.webp" alt=""/></span><span class="card-copy"><span class="card-name">ミドリ</span><span class="card-formal">モンステラ・デリシオーサ</span><span class="card-status">支柱へ誘引中。切れ込み葉と気根が増えてきた。</span></span></button><button class="plant-card" type="button" aria-label="モンステラ・デリシオーサ「ミドリ二号」の詳細を表示"><span class="card-image"><img loading="lazy" src="/members/ichijo/plants/03b-monstera-midori-2.webp" alt=""/></span><span class="card-copy"><span class="card-name">ミドリ二号</span><span class="card-formal">モンステラ・デリシオーサ</span><span class="card-status">葉は4枚。次の葉に小さな切れ込みが入り始めた。</span></span></button><button class="plant-card" type="button" aria-label="フィカス・ウンベラータ「ショウ」の詳細を表示"><span class="card-image"><img loading="lazy" src="/members/ichijo/plants/04a-ficus-umbellata-sho.webp" alt=""/></span><span class="card-copy"><span class="card-name">ショウ</span><span class="card-formal">フィカス・ウンベラータ</span><span class="card-status">約175cm。剪定後の二方向の枝先に新葉が2枚。</span></span></button><button class="plant-card" type="button" aria-label="フィカス・ウンベラータ「ハチ」の詳細を表示"><span class="card-image"><img loading="lazy" src="/members/ichijo/plants/04b-ficus-umbellata-hachi.webp" alt=""/></span><span class="card-copy"><span class="card-name">ハチ</span><span class="card-formal">フィカス・ウンベラータ</span><span class="card-status">剪定後の枝分かれが落ち着き、枝先に新芽。</span></span></button><button class="plant-card" type="button" aria-label="金鯱「マル」の詳細を表示"><span class="card-image"><img loading="lazy" src="/members/ichijo/plants/05-kinkachi-maru.webp" alt=""/></span><span class="card-copy"><span class="card-name">マル</span><span class="card-formal">金鯱</span><span class="card-status">球形を保ち、黄金色の棘が揃っている。</span></span></button><button class="plant-card" type="button" aria-label="月下美人「夜」の詳細を表示"><span class="card-image"><img loading="lazy" src="/members/ichijo/plants/06-gekkabijin-yoru.webp" alt=""/></span><span class="card-copy"><span class="card-name">夜</span><span class="card-formal">月下美人</span><span class="card-status">幅広い平たい茎節が伸びる。現在は花なし。</span></span></button><button class="plant-card" type="button" aria-label="ゴールデンポトス「二号」の詳細を表示"><span class="card-image"><img loading="lazy" src="/members/ichijo/plants/07a-pothos-nigo.webp" alt=""/></span><span class="card-copy"><span class="card-name">二号</span><span class="card-formal">ゴールデンポトス</span><span class="card-status">最長のつるは約140cm。先端ほど葉が小さい。</span></span></button><button class="plant-card" type="button" aria-label="ポトス・マーブルクイーン「シロ」の詳細を表示"><span class="card-image"><img loading="lazy" src="/members/ichijo/plants/07b-pothos-shiro.webp" alt=""/></span><span class="card-copy"><span class="card-name">シロ</span><span class="card-formal">ポトス・マーブルクイーン</span><span class="card-status">白と緑の斑が葉ごとに違う。葉焼けはなし。</span></span></button><button class="plant-card" type="button" aria-label="クッカバラ「ギザ」の詳細を表示"><span class="card-image"><img loading="lazy" src="/members/ichijo/plants/08-philodendron-xanadu-giza.webp" alt=""/></span><span class="card-copy"><span class="card-name">ギザ</span><span class="card-formal">クッカバラ</span><span class="card-status">葉数11。短い茎の株元から新芽が上がっている。</span></span></button><button class="plant-card" type="button" aria-label="サンセベリア・ローレンティー「窓右」の詳細を表示"><span class="card-image"><img loading="lazy" src="/members/ichijo/plants/09-sansevieria-laurentii-migimado.webp" alt=""/></span><span class="card-copy"><span class="card-name">窓右</span><span class="card-formal">サンセベリア・ローレンティー</span><span class="card-status">黄縁の剣状葉。窓の右側で姿を保っている。</span></span></button><button class="plant-card" type="button" aria-label="アロカシア・アマゾニカ「灰色鉢」の詳細を表示"><span class="card-image"><img loading="lazy" src="/members/ichijo/plants/10-alocasia-amazonica-haiirobachi.webp" alt=""/></span><span class="card-copy"><span class="card-name">灰色鉢</span><span class="card-formal">アロカシア・アマゾニカ</span><span class="card-status">葉は4枚。葉先に軽い乾燥跡が残る。</span></span></button><button class="plant-card" type="button" aria-label="シャムオリヅルラン「シャム」の詳細を表示"><span class="card-image"><img loading="lazy" src="/members/ichijo/plants/11-chlorophytum-laxum-bichetii-shamu.webp" alt=""/></span><span class="card-copy"><span class="card-name">シャム</span><span class="card-formal">シャムオリヅルラン</span><span class="card-status">白覆輪の細葉が密にまとまる。古葉の先に少し枯れ。</span></span></button><button class="plant-card" type="button" aria-label="オペルクリカリア・パキプス「太いの」の詳細を表示"><span class="card-image"><img loading="lazy" src="/members/ichijo/plants/12-operculicarya-pachypus-futoino.webp" alt=""/></span><span class="card-copy"><span class="card-name">太いの</span><span class="card-formal">オペルクリカリア・パキプス</span><span class="card-status">若い塊根。枝数は少なく、葉の出方に左右差がある。</span></span></button><button class="plant-card" type="button" aria-label="メセン寄せ植え「豆」の詳細を表示"><span class="card-image"><img loading="lazy" src="/members/ichijo/plants/13-mesen-mame.webp" alt=""/></span><span class="card-copy"><span class="card-name">豆</span><span class="card-formal">メセン寄せ植え</span><span class="card-status">コノフィツムとリトープスを、根を分けて同居させている。</span></span></button><button class="plant-card" type="button" aria-label="リュウビンタイ「リュウ」の詳細を表示"><span class="card-image"><img loading="lazy" src="/members/ichijo/plants/14-angiopteris-lygodiifolia-ryu.webp" alt=""/></span><span class="card-copy"><span class="card-name">リュウ</span><span class="card-formal">リュウビンタイ</span><span class="card-status">大きな二回羽状葉。鱗状の株元から新葉が上がる。</span></span></button><button class="plant-card" type="button" aria-label="パキラ「パキラ」の詳細を表示"><span class="card-image"><img loading="lazy" src="/members/ichijo/plants/15-pachira-pachira.webp" alt=""/></span><span class="card-copy"><span class="card-name">パキラ</span><span class="card-formal">パキラ</span><span class="card-status">約150cm。編み込み幹の上部を剪定して枝を整えた。</span></span></button><button class="plant-card" type="button" aria-label="アジアンタム・ラディアナム「ネット」の詳細を表示"><span class="card-image"><img loading="lazy" src="/members/ichijo/plants/16-adiantum-raddianum-net.webp" alt=""/></span><span class="card-copy"><span class="card-name">ネット</span><span class="card-formal">アジアンタム・ラディアナム</span><span class="card-status">薄い小葉が重なる。底面給水で乾燥を防いでいる。</span></span></button><button class="plant-card" type="button" aria-label="ホヤ・カルノーサ「ホヤ一号」の詳細を表示"><span class="card-image"><img loading="lazy" src="/members/ichijo/plants/17a-hoya-carnosa-hoya1.webp" alt=""/></span><span class="card-copy"><span class="card-name">ホヤ一号</span><span class="card-formal">ホヤ・カルノーサ</span><span class="card-status">肉厚の緑葉。星形の花がまとまって開花中。</span></span></button><button class="plant-card" type="button" aria-label="ホヤ・カルノーサ・コンパクタ「ホヤ二号」の詳細を表示"><span class="card-image"><img loading="lazy" src="/members/ichijo/plants/17b-hoya-carnosa-compacta-hoya2.webp" alt=""/></span><span class="card-copy"><span class="card-name">ホヤ二号</span><span class="card-formal">ホヤ・カルノーサ・コンパクタ</span><span class="card-status">ねじれた葉が連なる。新しいつるは約18cm。</span></span></button><button class="plant-card" type="button" aria-label="マランタ・レウコネウラ ‘ファッシネーター’「ナハ」の詳細を表示"><span class="card-image"><img loading="lazy" src="/members/ichijo/plants/18-maranta-leuconeura-fascinator-naha.webp" alt=""/></span><span class="card-copy"><span class="card-name">ナハ</span><span class="card-formal">マランタ・レウコネウラ ‘ファッシネーター’</span><span class="card-status">赤い葉脈の葉を、夜はやや立てて閉じる。</span></span></button><button class="plant-card" type="button" aria-label="ビカクシダ・ビフルカツム「板」の詳細を表示"><span class="card-image"><img loading="lazy" src="/members/ichijo/plants/19-platycerium-bifurcatum-ita.webp" alt=""/></span><span class="card-copy"><span class="card-name">板</span><span class="card-formal">ビカクシダ・ビフルカツム</span><span class="card-status">コルク板付け。貯水葉と二又の胞子葉が育っている。</span></span></button><button class="plant-card" type="button" aria-label="ストレリチア・ニコライ（オーガスタ）「デカい方」の詳細を表示"><span class="card-image"><img loading="lazy" src="/members/ichijo/plants/20-strelitzia-nicolai-dekaiho.webp" alt=""/></span><span class="card-copy"><span class="card-name">デカい方</span><span class="card-formal">ストレリチア・ニコライ（オーガスタ）</span><span class="card-status">約190cm。古葉には自然な裂けがあり、新葉も動いている。</span></span></button><button class="plant-card" type="button" aria-label="フィロデンドロン・スピリタスサンクチ「ラスト」の詳細を表示"><span class="card-image"><img loading="lazy" src="/members/ichijo/plants/21-philodendron-spiritus-sancti-last.webp" alt=""/></span><span class="card-copy"><span class="card-name">ラスト</span><span class="card-formal">フィロデンドロン・スピリタスサンクチ</span><span class="card-status">迎えたばかり。テレビ横で環境順応中。</span></span></button></div></div></div></section><section class="and-more"><p class="eyebrow">AND MORE</p><p>全部は載せてません。記録は手元にあります。増えたら数だけ更新します。</p></section><footer><p>recorded by Takeru Ichijo</p><p>50+ POTS / SELECTED 25</p></footer></main><!--$--><!--/$--><script src="/members/ichijo/_next/static/chunks/webpack-026941fc4e2600c5.js" id="_R_" async=""></script><script>(self.__next_f=self.__next_f||[]).push([0])</script><script>self.__next_f.push([1,"1:\"$Sreact.fragment\"\n2:I[1133,[],\"\"]\n3:I[4297,[],\"\"]\n4:I[1076,[],\"ClientPageRoot\"]\n5:I[112,[\"974\",\"static/chunks/app/page-2208f5ecc9aaf7d5.js\"],\"default\"]\n8:I[1872,[],\"OutletBoundary\"]\n9:\"$Sreact.suspense\"\nb:I[1872,[],\"ViewportBoundary\"]\nd:I[1872,[],\"MetadataBoundary\"]\nf:I[7567,[],\"default\",1]\n:HL[\"/members/ichijo/_next/static/css/c7a939dda1e6d3c0.css\",\"style\"]\n"])</script><script>self.__next_f.push([1,"0:{\"P\":null,\"c\":[\"\",\"\"],\"q\":\"\",\"i\":false,\"f\":[[[\"\",{\"children\":[\"__PAGE__\",{}]},\"$undefined\",\"$undefined\",16],[[\"$\",\"$1\",\"c\",{\"children\":[[[\"$\",\"link\",\"0\",{\"rel\":\"stylesheet\",\"href\":\"/members/ichijo/_next/static/css/c7a939dda1e6d3c0.css\",\"precedence\":\"next\",\"crossOrigin\":\"$undefined\",\"nonce\":\"$undefined\"}]],[\"$\",\"html\",null,{\"lang\":\"ja\",\"children\":[\"$\",\"body\",null,{\"className\":\"antialiased\",\"children\":[\"$\",\"$L2\",null,{\"parallelRouterKey\":\"children\",\"error\":\"$undefined\",\"errorStyles\":\"$undefined\",\"errorS
